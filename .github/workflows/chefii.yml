name: Chefii

on:
  push:
    paths: ['chefii/**', '.github/workflows/chefii.yml']
  pull_request:
    paths: ['chefii/**', '.github/workflows/chefii.yml']

defaults:
  run:
    working-directory: chefii

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: dart run tool/export_shared_data.dart --check

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chefii/functions/package-lock.json
      - run: npm ci
        working-directory: chefii/functions
      - run: npm run build
        working-directory: chefii/functions
      - run: npm test
        working-directory: chefii/functions

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: chefii/rules-tests
      - run: npx firebase emulators:exec --config ../firebase.json --only firestore --project demo-chefii "npx vitest run"
        working-directory: chefii/rules-tests

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: chefii-android
          path: |
            chefii/build/app/outputs/flutter-apk/app-debug.apk
            chefii/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: flutter build ios --simulator --debug
