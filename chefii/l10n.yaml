# Strings live in per-area parts (lib/l10n/parts/<area>_{en,fr}.arb).
# tool/merge_arb.dart combines them into lib/l10n/arb, then gen-l10n runs.
arb-dir: lib/l10n/arb
template-arb-file: app_en.arb
output-dir: lib/l10n/gen
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
untranslated-messages-file: build/untranslated.txt
