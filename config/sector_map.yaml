# SIC -> internal 11-bucket taxonomy. GICS is licensed and out of scope
# (SPEC §4), so this is coarse by necessity and the UI says so on screen.
#
# Ranges are inclusive and evaluated in order; the first match wins.
# Anything unmatched becomes `unknown`, which is a real value and is displayed
# as such — never silently bucketed into the largest sector.

sectors:
  energy:
    label: Energy
    benchmark: XLE
    sic_ranges: [[1200, 1399], [2900, 2999], [4600, 4699], [5170, 5172]]
  materials:
    label: Materials
    benchmark: XLB
    sic_ranges: [[1000, 1099], [1400, 1499], [2600, 2699], [2800, 2824], [2840, 2899], [3300, 3399]]
