# Postgres 16 for Windows/Docker Desktop. The Linux dev container runs a native
# cluster instead -- see scripts/dev.sh.
services:
  db:
    image: postgres:16
    container_name: imt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: imt
      POSTGRES_PASSWORD: imt
      POSTGRES_DB: imt
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imt -d imt"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
