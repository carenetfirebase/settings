[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invest"
version = "0.1.0"
description = "Zero-cost, institutional-style investment research platform."
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.1,<4.0",
  "pydantic>=2.6,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "typer>=0.12,<1.0",
  "httpx>=0.27,<1.0",
  "pandas>=2.2,<3.0",
  "numpy>=1.26,<3.0",
  "scipy>=1.12,<2.0",
  "fastapi>=0.110,<1.0",
  "uvicorn>=0.29,<1.0",
  # Swagger UI assets served locally instead of from a CDN — see api/app.py.
  # Must be a 5.x build: FastAPI emits OpenAPI 3.1, which 4.x cannot render.
  "swagger-ui-py>=23.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "httpx>=0.27",  # FastAPI TestClient transport
]

[project.scripts]
invest = "invest.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/invest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
ignore = [
  # typer's documented idiom is a call in the argument default.
  "B008",
  # This system reasons in calendar dates (trading days, filing dates), not
  # instants. Attaching a timezone to a settlement date would imply a precision
  # the source data does not have.
  "DTZ007",
  "DTZ011",
]
