[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invest"
version = "0.1.0"
description = "Zero-cost, institutional-style investment research platform."
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.1,<4.0",
  "pydantic>=2.6,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "typer>=0.12,<1.0",
  "httpx>=0.27,<1.0",
  "pandas>=2.2,<3.0",
  "numpy>=1.26,<3.0",
  "scipy>=1.12,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[project.scripts]
invest = "invest.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/invest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
