[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imt"
version = "0.1.0"
description = "Informed Money Terminal — local research terminal ranking public-evidence convergence."
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.1,<4.0",
  "pydantic>=2.6,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "typer>=0.12,<1.0",
  "httpx>=0.27,<1.0",
  "polars>=1.0,<2.0",
  "fastapi>=0.110,<1.0",
  "uvicorn>=0.29,<1.0",
  "structlog>=24.1,<26.0",
  "pyyaml>=6.0,<7.0",
  "rapidfuzz>=3.6,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-pyyaml",
]

[project.scripts]
imt = "imt.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/imt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
  "live: hits a real network endpoint; excluded by default",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["legacy", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DTZ", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The EDGAR .idx fixture is fixed-width by definition; wrapping its lines
# would stop it being a valid sample of the format.
"tests/test_adapters.py" = ["B011", "E501"]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/imt"]
exclude = ["legacy"]
plugins = []

[[tool.mypy.overrides]]
module = ["rapidfuzz.*", "yaml.*"]
ignore_missing_imports = true
