[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secondaryeob"
version = "0.1.0"
description = "Local dental EOB document-processing engine (HIPAA-capable architecture)"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=41",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
secondaryeob = "secondaryeob.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
